<defs>
<!-- Soft shadows with room to fade out. Figma's export clipped them to
     tight boxes (hard grey rectangles) and applied each one twice. -->
<filter id="shadow-down" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
<feOffset dy="4" result="blur"/>
<feFlood flood-color="#000" flood-opacity="0.35"/>
<feComposite in2="blur" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
<filter id="shadow-left" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
<feOffset dx="-3" result="blur"/>
<feFlood flood-color="#15154F" flood-opacity="0.55"/>
<feComposite in2="blur" operator="in"/>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
